name: Update GitHub Activity Overview

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-activity-overview.mjs"
      - ".github/workflows/activity-overview.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate activity overview SVG
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          GITHUB_USERNAME: erentaymaz
          OUTPUT_FILE: assets/activity-overview.svg
        run: node scripts/generate-activity-overview.mjs

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- assets/activity-overview.svg; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-overview.svg
          git commit -m "chore: update activity overview"
          git push
